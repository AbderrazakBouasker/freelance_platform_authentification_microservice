<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Internal CSS from login-page.component.css -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Styles pour centrer le conteneur */
        html {
            height: 100%;
            display: flex;
        }

        .container {
            display: flex;
            margin-top: 3.8rem;
            max-width: 100%;
            width: 80vw;
            height: 80vh;
            border-radius: 0.625rem;
            box-shadow: 0 0.25rem 1.25rem rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-left: 8rem;
        }

        .left, .right {
            flex: 1;
        }

        .left {
            flex: 0.8;
            background-image: url('../public/loginimg.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .logo {
            width: 5rem;
            height: auto;
            position: absolute;
            top: 0.2rem;
            left: 0.2rem;
            z-index: 1;
        }

        .right {
            flex: 0.5;
            background-color: #ffffff;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .header h1 {
            font-size: 2rem;
            color: #004F6D;
            margin-bottom: 0.4rem;
            text-align: center;
        }

        .header p {
            color: #004F6D;
            margin-bottom: 0.8rem;
            text-align: center;
        }

        .login-options {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
        }

        .icons {
            display: flex;
            justify-content: space-between;
            gap: 8rem;
            margin-top: 0.5rem;
        }

        .icons i {
            font-size: 2rem;
            cursor: pointer;
            color: #004F6D;
            transition: color 0.3s;
        }

        .icons i:hover {
            color: #3197c0;
        }

        .separator {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.7rem;
        }

        .line {
            flex: 1;
            height: 0.07rem;
            background-color: #ccc;
        }

        .form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form input {
            width: 26rem;
            padding: 0.625rem;
            border: 0.0625rem solid #ddd;
            border-radius: 0.3125rem;
            margin-top: 0.3125rem;
        }

        .submit-btn {
            width: 15rem;
            padding: 0.75rem;
            border: none;
            color: #ffffff;
            font-size: 1rem;
            border-radius: 0.3125rem;
            cursor: pointer;
            background-color: #FF532A;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        .submit-btn:hover {
            background-color: #fa8568;
        }

        .signup-link {
            text-align: center;
            margin-top: 0.9375rem;
            color: #004F6D;
            transition: color 0.3s;
            text-decoration: underline;
            cursor: pointer;
        }

        .signup-link:hover {
            color: #1d7597;
        }

        @media (max-width: 48rem) {
            .container {
                flex-direction: column;
                height: auto;
                width: 95vw;
            }

            .left {
                height: 12.5rem;
            }

            .right {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .form input {
                padding: 0.5rem;
            }

            .submit-btn {
                padding: 0.5rem;
            }
        }

        .input-with-icon {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .input-with-icon i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
        }

        .input-with-icon input {
            padding-left: 30px;
            flex: 1;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="left">
        <img class="logo" src="../public/logoprojet.PNG" alt="Logo">
    </div>
    <div class="right">
        <div class="header">
            <h1>Welcome Back!</h1>
            <p>Please sign in to your account</p>
        </div>
        <div class="login-container">
            <div class="login-options">
                <div class="login-title">Log In with</div>
                <div class="icons">
                    <i class="fab fa-google"></i>
                    <i class="fab fa-github"></i>
                </div>
            </div>
            <div class="separator">
                <div class="line"></div>
                <span>OR</span>
                <div class="line"></div>
            </div>
        </div>
        <!-- Login Form -->
        <form class="form" action="/login" method="POST">
            <div class="input-group">
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="email" name="userName" placeholder="Enter your User Name" />
                </div>
            </div>
            <div class="input-group">
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your Password" />
                </div>
            </div>
            <button type="submit" class="submit-btn">Log In</button>
            <p class="signup-link" onclick="redirectToRegister()">Don’t have an account?</p>
        </form>
    </div>
</div>

<!-- Inline JavaScript from login-page.component.ts -->
<script>
    function redirectToRegister() {
        // JavaScript logic for redirecting to the registration page
        window.location.href = '/register';
    }
</script>
</body>
</html>
